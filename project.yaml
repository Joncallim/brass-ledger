# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# Brass Ledger: a TypeScript monorepo (npm workspaces). The deterministic engine,
# schemas and content live under packages/ (sim, shared, content, headless, save-store,
# asset-pipeline); clients under apps/ and desktop/. Tests sit beside the code.
engine:
  name: Web
  version: 8.1.5
  language: TypeScript
  rendering: none (headless engine; React DOM workbench; Phaser 3 only in prototypes/map-room)
  physics: none (turn-based)
  code_root: packages
  test_root: packages

# Naming, as the code already does it (read from packages/ and apps/, 2026-11-18).
naming:
  classes: PascalCase; error classes end in Error (RevisionMismatchError)
  variables: camelCase; Zod schemas end in Schema (chiefPositionSchema)
  constants: UPPER_SNAKE_CASE (KESTREL_HQ_BELIEF_MODEL_ID)
  signals: kebab-case string discriminants on kind/type (ravellan-decision, command-set)
  files: kebab-case .ts modules; PascalCase .tsx for React components; *.test.ts(x) beside the code, *.spec.ts for Playwright
  scenes: PascalCase ending in Scene (prototypes/map-room only)

# performance.*: deliberately unset. Brass Ledger is turn-based and headless-first,
# with no frame loop to budget; /perf-profile reports NOT ASSESSED rather than
# measuring against an invented number. See technical-preferences.md.

# Review depth (product owner, 2026-11-18): rigor standard for documents, with
# review_mode pinned to full on purpose so every director and specialist review
# runs, including the independent adversarial review CLAUDE.md requires for
# replay/hash, save, concurrency and accepted-risk changes. workflow is pinned to
# minimal on purpose: the GROCER V2 contracts are the only design source, and
# design/game-brief.md points to them; no studio GDDs or ADRs duplicate them.
modes:
  rigor: standard
  review_mode: full
  workflow: minimal
